<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBERPAL | Neural Link Edition</title>
    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --cyber-bg: #000000;
            --cyber-card: #080808;
            --cyber-yellow: #FFE211;
            --cyber-border: #1a1a1a;
            --cyber-text: #FFFFFF;
        }
        body {
            background-color: var(--cyber-bg);
            color: var(--cyber-text);
            font-family: 'Orbitron', sans-serif;
            overflow-x: hidden;
            letter-spacing: 0.5px;
        }
        .mono { font-family: 'JetBrains Mono', monospace; }
        
        /* Cyber Card Styling */
        .cyber-card {
            background-color: var(--cyber-card);
            border: 2px solid var(--cyber-border);
            position: relative;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .cyber-card:hover {
            border-color: var(--cyber-yellow);
            box-shadow: 0 0 20px rgba(255, 226, 17, 0.1);
            transform: translateY(-2px);
        }
        .cyber-card::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            width: 15px;
            height: 15px;
            border-top: 3px solid var(--cyber-yellow);
            border-left: 3px solid var(--cyber-yellow);
        }
        .cyber-card::after {
            content: '';
            position: absolute;
            bottom: -2px;
            right: -2px;
            width: 15px;
            height: 15px;
            border-bottom: 3px solid var(--cyber-yellow);
            border-right: 3px solid var(--cyber-yellow);
        }

        /* Button Styling */
        .cyber-button {
            clip-path: polygon(10% 0, 100% 0, 100% 70%, 90% 100%, 0 100%, 0 30%);
            background: var(--cyber-yellow);
            color: black;
            font-weight: 900;
            text-transform: uppercase;
            padding: 10px 24px;
            transition: all 0.2s ease;
        }
        .cyber-button:hover {
            filter: brightness(1.2);
            transform: skew(-2deg);
        }

        /* Custom Scrollbar */
        .cyber-scroll::-webkit-scrollbar {
            height: 4px;
        }
        .cyber-scroll::-webkit-scrollbar-track {
            background: rgba(255, 226, 17, 0.05);
        }
        .cyber-scroll::-webkit-scrollbar-thumb {
            background: var(--cyber-yellow);
            box-shadow: 0 0 10px var(--cyber-yellow);
        }
        
        /* Modal Implementation */
        #game-modal {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 100;
            background: #000;
        }
        #game-modal.active {
            display: flex;
            flex-direction: column;
        }

        /* Glitch Effect */
        .glitch-text:hover {
            animation: glitch 0.3s cubic-bezier(.25,.46,.45,.94) both infinite;
            color: var(--cyber-yellow);
        }
        @keyframes glitch {
            0% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(-2px, -2px); }
            60% { transform: translate(2px, 2px); }
            80% { transform: translate(2px, -2px); }
            100% { transform: translate(0); }
        }

        /* Category Button Skew */
        .cat-btn {
            transition: all 0.2s ease;
            clip-path: polygon(5% 0, 100% 0, 95% 100%, 0% 100%);
        }
        .cat-btn.active {
            background-color: var(--cyber-yellow);
            color: black;
            border-color: var(--cyber-yellow);
        }
    </style>
</head>
<body class="selection:bg-yellow-500/50">

    <!-- Navigation -->
    <nav class="sticky top-0 z-40 border-b-2 border-yellow-500/20 bg-black/95 backdrop-blur-xl shrink-0">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between gap-8">
            <div class="flex items-center gap-4 shrink-0">
                <div class="w-10 h-10 bg-yellow-400 flex items-center justify-center shadow-[0_0_20px_rgba(255,226,17,0.4)] rotate-3">
                    <i data-lucide="gamepad-2" class="text-black w-6 h-6"></i>
                </div>
                <div class="flex flex-col leading-none">
                    <span class="text-xl font-black uppercase tracking-tighter text-yellow-400 glitch-text cursor-default">
                        CYBER<span class="text-white">PAL</span>
                    </span>
                    <span class="text-[9px] text-yellow-400 font-bold tracking-[0.3em] mt-1 ml-0.5 opacity-80 uppercase mono">Uplink Stable</span>
                </div>
            </div>

            <div class="relative flex-1 max-w-md group">
                <i data-lucide="search" class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-white/40 group-focus-within:text-yellow-400 transition-colors"></i>
                <input
                    id="search-input"
                    type="text"
                    placeholder="SCAN_FOR_FRAGMENTS..."
                    class="w-full h-11 bg-black border-2 border-white/10 rounded-none pl-11 pr-4 focus:outline-none focus:ring-0 focus:border-yellow-400 transition-all placeholder:text-white/20 text-sm mono uppercase"
                >
            </div>

            <div class="hidden md:flex items-center gap-3">
                <div class="flex items-center gap-2 px-3 py-1.5 bg-yellow-400/10 border border-yellow-400/30">
                    <div class="w-1.5 h-1.5 bg-yellow-400 rounded-full animate-pulse shadow-[0_0_10px_#FFE211]"></div>
                    <span class="text-[9px] font-black text-yellow-400 tracking-[0.2em] uppercase mono">Secure_Shell</span>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-6 py-10 relative">
        <!-- Categories -->
        <div id="category-bar" class="flex items-center gap-3 mb-12 overflow-x-auto pb-6 cyber-scroll">
            <!-- Rendered via JS -->
        </div>

        <!-- Grid Display -->
        <div id="game-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 auto-rows-[300px]">
            <!-- Rendered via JS -->
        </div>

        <div id="no-results" class="hidden py-32 text-center cyber-card bg-black/40 border-dashed">
            <i data-lucide="shield-alert" class="w-16 h-16 text-yellow-400 mx-auto mb-6 animate-pulse"></i>
            <h3 class="text-xl font-black text-yellow-400 uppercase tracking-[0.4em]">Zero Fragments Found</h3>
            <p class="text-white/20 text-[10px] mt-2 mono uppercase tracking-widest">Database query yielded null results for active scan</p>
        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t-2 border-yellow-500/10 py-16 px-6 mt-20">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-end gap-6">
            <div class="flex items-center gap-6">
                <div class="w-12 h-12 bg-white/5 flex items-center justify-center border border-white/10">
                    <i data-lucide="cpu" class="text-white/20 w-6 h-6"></i>
                </div>
                <div>
                  <span class="text-[10px] font-black text-yellow-400 uppercase tracking-[0.5em] block mb-1 mono opacity-40 italic">System_v3.5.0_Core</span>
                  <span class="text-[8px] text-white/20 block tracking-[0.2em] mono uppercase">Proxied // Encrypted // Sanitized</span>
                </div>
            </div>
            <div class="text-right">
                <p class="text-white/30 text-[10px] font-black uppercase tracking-[0.6em] italic bg-yellow-400/5 px-4 py-2 border border-white/5">
                    &copy; 2026 CYBERPAL [ACCESS_RESTRICTED]
                </p>
            </div>
        </div>
    </footer>

    <!-- Game Player Modal -->
    <div id="game-modal">
        <div class="h-16 flex items-center justify-between px-6 border-b-2 border-yellow-500 shrink-0 bg-black">
            <div class="flex items-center gap-4">
                <div class="w-10 h-10 bg-yellow-400 flex items-center justify-center group-hover:rotate-6 transition-transform">
                    <i data-lucide="zap" class="w-6 h-6 text-black"></i>
                </div>
                <div>
                    <h2 id="modal-title" class="font-black uppercase tracking-tighter text-2xl text-yellow-400 italic">Neural_Link</h2>
                    <span class="text-[9px] text-white/40 font-black uppercase tracking-[0.3em] flex items-center gap-2 leading-none mono">
                        <span class="w-1.5 h-1.5 bg-yellow-400 animate-ping"></span>
                        Synchronizing Brainwaves...
                    </span>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <button id="fullscreen-btn" class="px-4 h-10 border-2 border-white/10 hover:border-yellow-400 transition-colors uppercase mono text-[10px] font-bold flex items-center gap-2">
                    <i data-lucide="maximize" class="w-4 h-4"></i>
                    <span class="hidden sm:inline">Wideview</span>
                </button>
                <button id="close-modal" class="px-4 h-10 bg-yellow-400 text-black font-black hover:bg-white transition-all uppercase mono text-[10px] flex items-center gap-2">
                    <i data-lucide="power" class="w-4 h-4"></i>
                    <span class="hidden sm:inline">Terminate</span>
                </button>
            </div>
        </div>
        <div class="flex-1 relative bg-black flex items-center justify-center p-6">
            <div class="relative w-full h-full max-w-6xl shadow-[0_0_100px_rgba(255,226,17,0.15)] border-2 border-yellow-500/40 bg-[#080808]">
                <iframe id="game-frame" class="w-full h-full border-0" allowfullscreen sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>
            </div>
        </div>
        <div class="p-10 bg-black border-t-4 border-yellow-500 shrink-0">
            <div class="max-w-5xl mx-auto flex flex-col md:flex-row gap-12">
                <div class="flex-1">
                    <h4 class="text-white font-black text-[11px] uppercase tracking-[0.5em] mb-4 border-l-4 border-yellow-400 pl-4">FRAG_METADATA</h4>
                    <p id="modal-desc" class="text-[13px] text-yellow-400/70 leading-relaxed font-bold italic mono"></p>
                </div>
                <div class="shrink-0 flex items-center gap-10">
                   <div class="flex flex-col items-center">
                      <div class="w-24 h-10 border-2 border-yellow-500 flex items-center justify-center text-[11px] font-black mono text-yellow-400 bg-yellow-400/5">INPUT_0</div>
                      <span class="text-[9px] text-white/30 mt-2 uppercase font-black tracking-[0.2em] mono">Nav_Matrix</span>
                   </div>
                   <div class="flex flex-col items-center">
                      <div class="w-24 h-10 border-2 border-yellow-500 flex items-center justify-center text-[11px] font-black mono text-yellow-400 bg-yellow-400/5">INPUT_1</div>
                      <span class="text-[9px] text-white/30 mt-2 uppercase font-black tracking-[0.2em] mono">Execution</span>
                   </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Interface Logic -->
    <script>
        // Local database to ensure zero-latency fragment loading
        let games = [
            {
                "id": "fnaf-1",
                "title": "Five Nights at Freddy's 1",
                "category": "PORTS",
                "thumbnail": "https://m.media-amazon.com/images/I/717-hD6Mv4L.png",
                "url": "games/fnaf1.html",
                "description": "CRITICAL THREAT DETECTED: Monitor surveillance fragments to maintain containment. Low-power protocols active. Survive the shift."
            }
        ];
        
        let activeCategory = 'ALL GAMES';
        let searchQuery = '';
        const categories = ["ALL GAMES", "FAVORITES", "DOS", "EMULATOR", "FLASH", "GBA", "NG4", "NDS", "NES", "PORTS", "PSX", "TOOLS"];

        const grid = document.getElementById('game-grid');
        const categoryBar = document.getElementById('category-bar');
        const searchInput = document.getElementById('search-input');
        const noResults = document.getElementById('no-results');
        const modal = document.getElementById('game-modal');
        const frame = document.getElementById('game-frame');

        function init() {
            renderCategories();
            renderGames();
            lucide.createIcons();
        }

        function renderCategories() {
            categoryBar.innerHTML = categories.map(cat => `
                <button 
                    onclick="setCategory('${cat}')"
                    class="cat-btn px-6 py-2 border-2 text-[11px] font-black uppercase tracking-widest ${activeCategory === cat ? 'active bg-yellow-400 text-black border-yellow-400' : 'bg-transparent border-white/10 text-white hover:border-yellow-400'}"
                >
                    ${cat}
                </button>
            `).join('');
        }

        function setCategory(cat) {
            activeCategory = cat;
            renderCategories();
            renderGames();
        }

        function renderGames() {
            const filtered = games.filter(g => {
                const matchesSearch = g.title.toLowerCase().includes(searchQuery.toLowerCase());
                const matchesCategory = activeCategory === 'ALL GAMES' || g.category === activeCategory;
                return matchesSearch && matchesCategory;
            });

            if (filtered.length === 0) {
                grid.classList.add('hidden');
                noResults.classList.remove('hidden');
            } else {
                grid.classList.remove('hidden');
                noResults.classList.add('hidden');
                grid.innerHTML = filtered.map((g, i) => `
                    <div 
                        onclick="playGame('${g.id}')"
                        class="group relative cyber-card overflow-hidden cursor-pointer"
                    >
                        <div class="absolute inset-0 z-0 bg-black">
                            <img src="${g.thumbnail}" alt="${g.title}" class="w-full h-full object-cover opacity-90 group-hover:opacity-100 transition-all duration-500 scale-100 group-hover:scale-105">
                            <div class="absolute inset-0 bg-gradient-to-t from-black via-black/20 to-transparent opacity-90 transition-opacity"></div>
                        </div>
                        <div class="relative z-10 p-6 h-full flex flex-col justify-end">
                            <div class="mb-2">
                                <span class="text-[9px] font-black text-black bg-yellow-400 px-3 py-1 uppercase tracking-widest shadow-[0_0_15px_rgba(255,226,17,0.3)]">${g.category}</span>
                            </div>
                            <h3 class="text-2xl font-black uppercase tracking-tighter group-hover:text-yellow-400 transition-colors italic leading-tight text-white drop-shadow-[0_2px_4px_rgba(0,0,0,0.8)]">${g.title}</h3>
                            <p class="text-[10px] text-white/70 line-clamp-1 mt-1 font-bold mono uppercase tracking-wider mb-4 border-l-2 border-yellow-400 pl-2 drop-shadow-[0_1px_2px_rgba(0,0,0,0.8)]">${g.description}</p>
                            <div class="flex items-center gap-3">
                                <div class="px-5 py-2.5 bg-yellow-400 text-black text-[11px] font-black uppercase tracking-tighter skew-x-[-10deg] group-hover:bg-white transition-all shadow-xl">
                                    INITIATE_GAME
                                </div>
                            </div>
                        </div>
                        <div class="absolute top-4 right-4 opacity-0 group-hover:opacity-100 transition-opacity">
                            <i data-lucide="external-link" class="w-5 h-5 text-yellow-400"></i>
                        </div>
                    </div>
                `).join('');
            }
            lucide.createIcons();
        }

        function playGame(id) {
            const game = games.find(g => g.id === id);
            if (!game) return;
            
            document.getElementById('modal-title').innerText = game.title;
            document.getElementById('modal-desc').innerText = game.description;
            
            // Clear and reload frame to ensure fresh state
            frame.src = 'about:blank';
            setTimeout(() => {
                frame.src = game.url;
            }, 50);
            
            modal.classList.add('active');
        }

        searchInput.addEventListener('input', (e) => {
            searchQuery = e.target.value;
            renderGames();
        });

        document.getElementById('close-modal').addEventListener('click', () => {
            modal.classList.remove('active');
            frame.src = '';
        });

        document.getElementById('fullscreen-btn').addEventListener('click', () => {
            if (frame.requestFullscreen) frame.requestFullscreen();
            else if (frame.webkitRequestFullscreen) frame.webkitRequestFullscreen();
            else if (frame.msRequestFullscreen) frame.msRequestFullscreen();
        });

        init();
    </script>
</body>
</html>
